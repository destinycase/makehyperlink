name: Publish MakeHyperlink 2.0.2
on:
  push:
    branches:
      - release/v2.0.2
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: 035733f12bdab4eafaafd6eddc50786ce7023dfc
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release
        run: |
          node --test tests/*.test.cjs
          node -e "const m = require('./manifest.json'); if (m.version !== '2.0.2' || m.permissions.includes('activeTab')) process.exit(1)"
          echo "f46fff3448ee5e1b2e749ba93edbca61aff109770fdec0e690c81b87b53bc0b1  release/makehyperlink-v2.0.2.zip" | sha256sum -c -
          unzip -t release/makehyperlink-v2.0.2.zip
      - name: Publish version 2.0.2
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0.2
          target_commitish: 035733f12bdab4eafaafd6eddc50786ce7023dfc
          name: Release v2.0.2
          files: release/makehyperlink-v2.0.2.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            - 중복된 activeTab 권한을 제거했습니다. 기존 호스트 권한으로 웹페이지 접근을 처리합니다.
            - 유저 가이드와 개발자 가이드를 정리하고 Chrome 웹 스토어 설치 링크를 안내합니다.
            - 배포 ZIP을 release 폴더에서 관리하도록 로컬 빌드와 자동 배포 경로를 통일했습니다.
            - 회귀 테스트 32개 및 배포 ZIP 무결성 검증을 통과했습니다.
