name: Release MakeHyperlink

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Create Zip Package
        run: |
          mkdir -p release
          rm -f release/makehyperlink-${{ github.ref_name }}.zip
          cd src
          zip -r ../release/makehyperlink-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            content.js \
            sidepanel.html \
            sidepanel.js \
            history.js \
            help.js \
            settings.js \
            i18n.js \
            sidepanel.css \
            icons/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/makehyperlink-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            MakeHyperlink v2.1.5

            - Add a settings dialog next to Help.
            - Choose English (default) or Korean; persist the selected language locally.
            - Localize panel controls, help, settings and context menus.
            - Move shortcut controls into Settings and stop recording when it closes.
            - Exclude local store promotional assets from Git and release packages.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
