name: Release MakeHyperlink

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Zip Package
        run: |
          mkdir -p dist
          zip -r dist/makehyperlink-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            content.js \
            style.css \
            popup.html \
            popup.js \
            popup.css \
            icons/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/makehyperlink-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            MakeHyperlink 확장 프로그램의 새로운 버전이 릴리스되었습니다.
            
            ### 변경 사항
            - 최신 업데이트 반영
            - 안정성 및 UX 개선
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
