name: Release MakeHyperlink

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Create Zip Package
        run: |
          mkdir -p release
          rm -f release/makehyperlink-${{ github.ref_name }}.zip
          zip -r release/makehyperlink-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            content.js \
            sidepanel.html \
            sidepanel.js \
            history.js \
            sidepanel.css \
            icons/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/makehyperlink-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            MakeHyperlink 확장 프로그램의 새로운 버전이 릴리스되었습니다.
            
            ### 변경 사항
            - 브라우저 사이드 패널에서 복사 히스토리 확인, 다시 복사, 링크 이동 및 삭제
            - 최근 100개 로컬 저장 및 중복 항목 갱신
            - 텍스트를 선택하지 않으면 탭 제목과 주소로 하이퍼링크 복사
            - 복사 성공·실패 배지를 1초간 표시
            - 컴팩트한 목록과 스크롤 위치 유지
            - 단축키 복구, 클립보드 권한 및 제한 페이지 안내 개선
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
