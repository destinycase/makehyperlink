name: Release MakeHyperlink

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Create Zip Package
        run: |
          mkdir -p release
          rm -f release/makehyperlink-${{ github.ref_name }}.zip
          cd src
          zip -r ../release/makehyperlink-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            content.js \
            sidepanel.html \
            sidepanel.js \
            history.js \
            help.js \
            sidepanel.css \
            icons/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/makehyperlink-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            MakeHyperlink v2.1.4

            - Edit tile display text with confirm/cancel and Enter/Escape support.
            - Preserve link URLs, timestamps and list order when editing or re-copying.
            - Keep drafts during live list updates and reject empty labels.
            - Align two-line tiles and use consistent 20px action buttons.
            - Update usage popup, user guide and developer documentation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
