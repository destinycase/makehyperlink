name: Release MakeHyperlink

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run regression tests
        run: node --test tests/*.test.cjs

      - name: Create Zip Package
        run: |
          mkdir -p release
          rm -f release/makehyperlink-${{ github.ref_name }}.zip
          cd src
          zip -r ../release/makehyperlink-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            content.js \
            sidepanel.html \
            sidepanel.js \
            history.js \
            help.js \
            sidepanel.css \
            icons/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/makehyperlink-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            MakeHyperlink v2.1.3

            - Add in-panel help dialog with copy, list, shortcut and status guidance.
            - Organize copying instructions into three methods; omit paste instructions.
            - Support close button, Escape and focus restoration.
            - Include help.js in local and automated release packages.
            - Update user and developer documentation.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
